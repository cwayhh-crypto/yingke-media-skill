name: Verify repository
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Validate source syntax
        run: |
          test -f yingke-media/SKILL.md
          python -m compileall -q yingke-media engine-template
          find engine-template yingke-media -name "*.mjs" -print0 | xargs -0 -n 1 node --check
