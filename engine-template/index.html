<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>映刻 · 创作工作台</title><style>
:root{--ink:#20372e;--muted:#78877f;--green:#315d47;--line:#dce4d9;--bg:#f4f5f0}*{box-sizing:border-box}body{margin:0;font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif;color:var(--ink);background:var(--bg);height:100vh;overflow:hidden}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;color:var(--green);padding:9px 13px}button:hover{border-color:#8aa574}button:disabled{opacity:.5;cursor:wait}.app{display:grid;grid-template-columns:188px 1fr;height:100vh}.sidebar{background:#1c342b;color:#e5eddf;display:flex;flex-direction:column;padding:29px 17px;gap:8px}.brand{font-size:26px;font-weight:700;letter-spacing:4px;padding:0 14px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:#a2b69c;margin-top:2px}.nav{margin-top:36px;display:grid;gap:9px}.nav button{border:0;background:none;text-align:left;color:#bbcdc1;padding:13px 16px;font-size:14px}.nav button.active{background:#35513c;color:#e4f4bc}.nav span{display:inline-block;width:25px;font-size:12px;color:#94ad8b}.side-foot{margin-top:auto;padding:14px;font-size:11px;color:#a4b4a6;line-height:1.9}.side-foot b{display:block;color:#e1e9da;font-weight:500}.main{min-width:0;display:flex;flex-direction:column}.bar{height:77px;flex-shrink:0;background:#fbfcf9;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:17px 29px}.bar h1{margin:0;font-size:20px;font-weight:650}.bar p{font-size:11px;color:var(--muted);margin:1px 0 0}.status{font-size:11px;background:#e7eddf;padding:6px 12px;border-radius:20px;color:#59744c}.status.error{background:#f6e9de;color:#955a37}.stage{flex:1;position:relative;min-height:0}.page{width:100%;height:100%;border:0;display:none}.page.active{display:block}.library{overflow:auto;padding:25px 29px}.intro{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.intro h2{margin:0;font-size:22px;font-weight:600}.intro p{color:var(--muted);font-size:12px;margin:3px 0 0}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{padding:10px 14px;border:1px solid var(--line);border-radius:9px;min-width:245px;background:white;outline:none;color:var(--ink)}.filters{display:flex;gap:7px;margin-bottom:20px;flex-wrap:wrap}.filters button{font-size:12px;background:none;padding:6px 13px}.filters .active{background:var(--green);color:white;border-color:var(--green)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:16px}.card{border:1px solid var(--line);background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.cover{height:134px;background:#e6ecdd;display:flex;align-items:center;justify-content:center;position:relative}.cover img{width:100%;height:100%;object-fit:cover}.cover .symbol{font-size:35px;font-weight:300;color:#8ba274}.kind{position:absolute;left:12px;bottom:11px;background:#213c2bcc;color:#f2f7ec;padding:2px 9px;font-size:10px;border-radius:5px}.card-body{padding:15px;display:flex;flex-direction:column;flex:1}.name{font-size:12px;font-weight:600;line-height:1.7;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:41px}.meta{color:var(--muted);font-size:11px;margin:7px 0 13px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}.actions button{font-size:11px;padding:6px 9px}.primary{background:var(--green);color:white;border-color:var(--green)}.empty{padding:60px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#233f2e;color:white;border-radius:9px;padding:11px 22px;max-width:75vw;z-index:20}.hidden{display:none!important}.startup{padding:60px 30px;color:var(--muted)}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">映刻<small>CREATION WORKBENCH</small></div><nav class="nav"><button data-tab="download" class="active"><span>01</span>视频下载</button><button data-tab="library"><span>02</span>素材库</button><button data-tab="subtitles"><span>03</span>字幕工作室</button></nav><div class="side-foot"><b>从视频到可用素材</b>视频 · 音频 · 海报<br>转写 · 时间轴 · 说话人<br><br>Windows 客户端 · v3.0 统一版</div></aside><main class="main"><header class="bar"><div><h1 id="title">视频下载</h1><p id="subtitle">粘贴链接，收录原视频、音频和海报</p></div><div class="status" id="status">正在连接本地模块</div></header><div class="stage"><div id="startup" class="startup">正在准备工作台，请稍候…</div><iframe class="page" id="download" title="视频下载工作区"></iframe><section class="page library" id="library"><div class="intro"><div><h2>素材，集中在这里。</h2><p id="count">已下载素材会自动收录，可直接生成字幕</p></div><div class="tools"><input class="search" id="search" placeholder="搜索素材名称" aria-label="搜索素材"><button id="refresh">刷新</button><button id="open-folder">打开素材目录</button></div></div><div class="filters"><button class="active" data-filter="all">全部</button><button data-filter="video">视频</button><button data-filter="audio">音频</button><button data-filter="poster">海报</button></div><div id="cards" class="cards"></div></section><iframe class="page" id="subtitles" title="字幕工作区"></iframe></div></main></div><div id="toast" class="toast hidden"></div><script>
const TOKEN='__SESSION_TOKEN__',el=id=>document.getElementById(id);let current='download',filter='all',overview=null,ready=false,lastAssets='',pendingPath=null;
function toast(message){el('toast').textContent=message;el('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el('toast').classList.add('hidden'),6000);}
async function api(route,body){const r=await fetch(route,{method:body?'POST':'GET',headers:{'X-Session-Token':TOKEN,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data;}
const labels={download:['视频下载','粘贴链接，收录原视频、音频和海报'],library:['素材库','下载与字幕处理之间的统一素材入口'],subtitles:['字幕工作室','本地转写、区分说话人、校对时间轴与导出']};
function switchTab(tab){if(!labels[tab])return;current=tab;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',ready&&p.id===tab));[el('title').textContent,el('subtitle').textContent]=labels[tab];if(tab==='library')refresh();}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function sendToSubtitles(path){pendingPath=path;switchTab('subtitles');deliverPath();}
function deliverPath(){if(!pendingPath||!el('subtitles').contentWindow?.yingkeHasUnsaved)return;el('subtitles').contentWindow.postMessage({type:'yingke-select',path:pendingPath},location.origin);pendingPath=null;}
el('subtitles').onload=deliverPath;
window.addEventListener('message',e=>{if(e.origin!==location.origin||![el('download').contentWindow,el('subtitles').contentWindow].includes(e.source))return;if(e.data?.type==='yingke-subtitle'&&typeof e.data.path==='string')sendToSubtitles(e.data.path);if(e.data?.type==='yingke-tab')switchTab(e.data.tab);});
function button(text,action,primary=false){const b=document.createElement('button');b.textContent=text;b.className=primary?'primary':'';b.onclick=async()=>{b.disabled=true;try{await action();}catch(e){toast(e.message);}finally{b.disabled=false;}};return b;}
function render(){if(!overview)return;const files=overview.files,q=el('search').value.trim().toLowerCase();el('count').textContent=`${files.filter(x=>x.kind==='video').length} 个视频 · ${files.filter(x=>x.kind==='audio').length} 个音频 · ${files.filter(x=>x.kind==='poster').length} 张海报`;el('cards').replaceChildren();const found=files.filter(x=>(filter==='all'||filter===x.kind)&&x.name.toLowerCase().includes(q));for(const f of found){const card=document.createElement('article');card.className='card';const cover=document.createElement('div');cover.className='cover';const poster=f.kind==='poster'?f:files.find(x=>x.jobId===f.jobId&&x.kind==='poster');if(poster){const img=document.createElement('img');img.src='/api/asset?id='+poster.id;img.alt='';img.loading='lazy';cover.append(img);}else{const symbol=document.createElement('span');symbol.className='symbol';symbol.textContent=f.kind==='audio'?'♫':'▷';cover.append(symbol);}const kind=document.createElement('span');kind.className='kind';kind.textContent={video:'视频',audio:'音频',poster:'海报'}[f.kind];cover.append(kind);const body=document.createElement('div');body.className='card-body';const name=document.createElement('div');name.className='name';name.textContent=f.name;name.title=f.name;const meta=document.createElement('div');meta.className='meta';meta.textContent=(f.size/1048576).toFixed(1)+' MB · 已保存在本机';const actions=document.createElement('div');actions.className='actions';if(f.kind!=='poster')actions.append(button('生成字幕',()=>sendToSubtitles(f.path),true));actions.append(button('打开目录',()=>api('/api/open',{id:f.jobId})),button('另存文件',()=>{const a=document.createElement('a');a.href='/api/asset?id='+f.id;a.download=f.name;document.body.append(a);a.click();a.remove();}));body.append(name,meta,actions);card.append(cover,body);el('cards').append(card);}if(!found.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=q?'没有找到匹配的素材':'暂无素材，先从「视频下载」收录一个视频。';el('cards').append(empty);}}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render();});el('search').oninput=render;el('refresh').onclick=()=>refresh(true);el('open-folder').onclick=()=>api('/api/open',{}).catch(e=>toast(e.message));
async function refresh(force=false){try{const health=await(await fetch('/health')).json();if(!health.ready)throw Error(health.error||'正在启动本地模块…');overview=await api('/api/overview');if(!ready){ready=true;el('startup').classList.add('hidden');el('download').src='/download/';el('subtitles').src='/subtitles/';switchTab(current);}const restricted=overview.download.network?.status==='restricted';el('status').textContent=overview.busy?`${overview.busy} 个任务进行中`:restricted?'本地功能就绪 · 当前进程禁止联网':'本地模块已连接';el('status').classList.toggle('error',restricted);const key=JSON.stringify(overview.files);if(force||lastAssets!==key){lastAssets=key;render();}deliverPath();}catch(e){el('status').textContent=e.message;el('status').classList.add('error');if(!ready)el('startup').textContent=e.message;}}
window.yingkeHasUnsaved=()=>Boolean(el('subtitles').contentWindow?.yingkeHasUnsaved?.());
window.yingkeBusy=()=>Boolean(overview?.busy);
window.yingkeExit=async()=>{await api('/api/exit',{});return true;};
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===el('subtitles').contentWindow&&e.data?.type==='yingke-save'&&window.chrome?.webview)window.chrome.webview.postMessage({type:'save',url:e.data.url,name:e.data.name});});
document.addEventListener('click',e=>{const a=e.target.closest('a[download]');if(!a||!window.chrome?.webview)return;const u=new URL(a.href);if(u.pathname!=='/api/asset')return;e.preventDefault();window.chrome.webview.postMessage({type:'save',url:u.pathname+u.search,name:a.download});},true);
window.addEventListener('beforeunload',e=>{if(window.yingkeHasUnsaved()){e.preventDefault();e.returnValue='';}});
refresh();setInterval(refresh,3000);
</script></body></html>
